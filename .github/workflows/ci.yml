name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha grep filter"
        required: false
        default: ""

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Lint and check format
        run: |
          npm run lint
          npm run format

  test-libs:
    name: Libs - Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: lint

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        if: inputs.test-filter == ''
        shell: bash
        run: |
          npm run build:libs
          npm run test:libs
      - name: Build and test (filtered)
        if: inputs.test-filter != ''
        shell: bash
        run: |
          npm run build:libs
          npm run test:libs -- --grep "${{ inputs.test-filter }}"
      - name: Pack commons-server
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd packages/commons-server
          npm pack
          mv mockoon-commons-server-4.1.0.tgz commons-server-4.1.0.tgz
      - name: Upload artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: commons-server-tgz
          path: packages/commons-server/commons-server-4.1.0.tgz
          if-no-files-found: error

  test-serverless:
    name: Serverless - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: [lint, test-libs]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        run: |
          npm run build:libs
          npm run build:serverless
          npm run test:serverless

  test-cli:
    name: CLI - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: [lint, test-libs]

    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        shell: bash
        run: |
          if [ "${{ matrix.node }}" = "16" ]; then
            npm install -g npm@9
          else
            npm install -g npm@latest
          fi
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        run: |
          npm run build:libs
          npm run build:cli
          npm run test:cli

  # run all tests (unpackaged desktop app, CI build)
  test-desktop:
    name: Desktop - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs: [lint, test-libs]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
      - name: Run tests
        run: |
          export DISPLAY=':99.0'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm run test:desktop

  # run desktop packaged tests when on the main branch (commits on main are always release candidates)

  test-desktop-packaged-win:
    name: Desktop packaged Windows - Build and test
    runs-on: windows-latest
    timeout-minutes: 60

    needs: [lint, test-libs]

    if: false

    env:
      CSC_LINK: ${{secrets.WIN_CSC_LINK}}
      CSC_KEY_PASSWORD: ${{secrets.WIN_CSC_KEY_PASSWORD}}

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:win
      - name: Run tests
        run: |
          npm run test:desktop:packaged:win

  test-desktop-packaged-mac:
    name: Desktop packaged MacOS - Build and test
    runs-on: macos-latest
    timeout-minutes: 120

    needs: [lint, test-libs]

    if: false

    env:
      APPLEID: ${{secrets.APPLEID}}
      TEAMID: ${{secrets.TEAMID}}
      APPLEIDPASS: ${{secrets.APPLEIDPASS}}
      ASCPROVIDER: ${{secrets.ASCPROVIDER}}
      CSC_LINK: ${{secrets.MACOS_CSC_LINK}}
      CSC_KEY_PASSWORD: ${{secrets.MACOS_CSC_KEY_PASSWORD}}
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:mac
      - name: Run tests
        run: |
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm run test:desktop:packaged:mac

  test-desktop-packaged-linux:
    name: Desktop packaged Linux - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs: [lint, test-libs]

    if: false

    env:
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Set registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set "//time-machines-npm.sealsecurity.io/:_authToken=2023-08-25"
      - name: Update NPM
        run: |
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:linux
      - name: Run tests
        run: |
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm run test:desktop:packaged:linux
